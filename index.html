<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Future Wife</title>

  <style>
    :root {
      --bg-top: #f3f7fb;
      --bg-bottom: #d7e4ef;
      --envelope: #9fb7c9;
      --envelope-dark: #7f9bb0;
      --paper: #fffdf8;
      --ink: #4c6274;
      --gold: #c69a55;
      --shadow: rgba(98, 45, 67, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.95), transparent 28%),
        radial-gradient(circle at 85% 15%, rgba(255,255,255,.65), transparent 25%),
        linear-gradient(145deg, var(--bg-top), var(--bg-bottom));
    }

    .sparkles,
    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: min(92vw, 680px);
      min-height: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 1400px;
    }

    .title {
      margin: 0 0 24px;
      text-align: center;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 400;
      letter-spacing: 0.03em;
      transition: opacity .8s ease, transform .8s ease;
      text-shadow: 0 8px 30px rgba(110, 59, 75, .12);
    }

    .subtitle {
      display: block;
      margin-top: 10px;
      font-family: Arial, sans-serif;
      font-size: clamp(.8rem, 2.3vw, 1rem);
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #7993aa;
    }

    .envelope-wrapper {
      position: relative;
      width: min(86vw, 430px);
      height: 360px;
      filter: drop-shadow(0 24px 25px var(--shadow));
      transform: translateY(-35px);
      transition: transform 1s cubic-bezier(.2,.8,.2,1);
    }

    .envelope {
      position: absolute;
      inset: 0;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    .opened .envelope {
      overflow: visible;
    }

    .back {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 285px;
      border-radius: 8px;
      background: linear-gradient(135deg, #bfd1df, var(--envelope));
      overflow: hidden;
    }

    .letter {
      position: absolute;
      z-index: 2;
      left: 7%;
      bottom: 18px;
      width: 72%;
      left: 14%;
      height: 245px;
      padding: 34px 28px 26px;
      text-align: center;
      background:
        linear-gradient(rgba(255,255,255,.72), rgba(255,255,255,.72)),
        repeating-linear-gradient(
          0deg,
          transparent 0 28px,
          rgba(198,154,85,.08) 28px 29px
        ),
        var(--paper);
      border: 1px solid rgba(198,154,85,.35);
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(90, 35, 55, .12);
      transform: translateY(235px);
      transition:
        transform 1.45s cubic-bezier(.22,.9,.24,1) .45s,
        height 1s ease .55s,
        width 1s ease .55s,
        left 1s ease .55s;
      overflow: hidden;
    }

    .letter::before,
    .letter::after {
      content: "❦";
      position: absolute;
      color: var(--gold);
      opacity: .6;
      font-size: 22px;
    }

    .letter::before {
      left: 16px;
      top: 12px;
    }

    .letter::after {
      right: 16px;
      bottom: 12px;
      transform: rotate(180deg);
    }


    .scratch-card {
      position: relative;
      width: 72%;
      max-width: 260px;
      min-width: 220px;
      height: 125px;
      margin: 14px auto 0;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(198,154,85,.45);
      box-shadow: 0 14px 30px rgba(110,59,75,.15);
      background: linear-gradient(135deg, #eef4f8, #dbe8f1);
      touch-action: none;
      user-select: none;
    }

    .date-reveal {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.9), transparent 30%),
        linear-gradient(145deg, #f7fbfd, #d6e4ef);
    }

    .date-label {
      margin-bottom: 8px;
      font: 600 .74rem/1 Arial, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #68849b;
    }

    .date-reveal strong {
      font-size: clamp(1.05rem, 3.2vw, 1.65rem);
      font-weight: 400;
      color: #58748d;
      text-shadow: 0 3px 12px rgba(110,59,75,.12);
    }

    .date-place {
      margin-top: 10px;
      font-size: 1rem;
      font-style: italic;
      color: #748da3;
    }

    #scratchCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .scratch-hint {
      margin-top: 12px !important;
      font-size: .92rem !important;
      line-height: 1.4 !important;
      color: #6f879b;
    }

    .scratch-card.completed #scratchCanvas {
      opacity: 0;
      transition: opacity .7s ease;
      pointer-events: none;
    }

    .letter h2 {
      margin: 0 0 18px;
      font-size: clamp(1.6rem, 4vw, 2.25rem);
      font-weight: 400;
      color: #58748d;
    }

    .letter p {
      margin: 0 auto;
      max-width: 440px;
      font-size: clamp(1rem, 2.5vw, 1.18rem);
      line-height: 1.75;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .8s ease 1.35s, transform .8s ease 1.35s;
    }

    .signature {
      margin-top: 20px !important;
      font-size: 1.35rem !important;
      font-style: italic;
      color: #6c879f;
    }

    .front {
      position: absolute;
      z-index: 3;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 285px;
      overflow: hidden;
      border-radius: 8px;
    }

    .front::before,
    .front::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 72%;
      height: 100%;
      background: linear-gradient(145deg, var(--envelope), #90adc4);
    }

    .front::before {
      left: -22%;
      clip-path: polygon(0 0, 100% 55%, 100% 100%, 0 100%);
    }

    .front::after {
      right: -22%;
      clip-path: polygon(0 55%, 100% 0, 100% 100%, 0 100%);
    }

    .pocket {
      position: absolute;
      z-index: 4;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 285px;
      background: linear-gradient(160deg, #b9cfdd, #89a9c1);
      clip-path: polygon(0 48%, 50% 80%, 100% 48%, 100% 100%, 0 100%);
      border-radius: 0 0 8px 8px;
    }

    .flap {
      position: absolute;
      z-index: 5;
      left: 0;
      top: 75px;
      width: 100%;
      height: 245px;
      transform-origin: 50% 0;
      transform: rotateX(0deg);
      transform-style: preserve-3d;
      transition: transform 1.15s cubic-bezier(.35,.05,.2,1);
    }

    .flap::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #c4d5e3, var(--envelope-dark));
      clip-path: polygon(0 0, 100% 0, 50% 92%);
      backface-visibility: hidden;
      border-radius: 8px 8px 0 0;
    }

    .seal {
      position: absolute;
      z-index: 6;
      left: 50%;
      top: 215px;
      width: 66px;
      height: 66px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(1);
      color: #fff7df;
      font-size: 29px;
      background:
        radial-gradient(circle at 35% 30%, #e9cf8d, #b67d36 68%, #8e5d24);
      border: 2px solid rgba(255,255,255,.45);
      box-shadow:
        inset 0 0 0 4px rgba(255,255,255,.12),
        0 8px 14px rgba(100,55,20,.25);
      transition: transform .5s ease, opacity .45s ease;
    }

    .open-button {
      position: fixed;
      left: 50%;
      bottom: 2px;
      z-index: 1000;
      margin-top: 0;
      padding: 15px 34px;
      border: 1px solid rgba(143, 78, 98, .2);
      border-radius: 999px;
      color: white;
      background: linear-gradient(135deg, #6f8fa8, #54758f);
      font: 600 .92rem/1 Arial, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(143,78,98,.26);
      transform: translateX(-50%);
      transition: transform .25s ease, box-shadow .25s ease, opacity .6s ease;
    }

    .open-button:hover {
      transform: translateX(-50%) translateY(-3px) scale(1.025);
      box-shadow: 0 16px 34px rgba(143,78,98,.34);
    }

    .open-button:active {
      transform: translateX(-50%) scale(.98);
    }

    .opened .flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .opened .seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(.2) rotate(35deg);
    }

    .opened .letter {
      transform: translateY(-285px);
      width: 88%;
      left: 6%;
      height: 280px;
    }

    .opened .letter p {
      opacity: 1;
      transform: translateY(0);
    }

    .opened .envelope-wrapper {
      transform: translateY(28px);
    }

    .opened .title {
      opacity: 0;
      transform: translateY(-25px);
    }

    .opened .open-button {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(20px);
    }

    .heart {
      position: absolute;
      bottom: -50px;
      color: rgba(190, 86, 119, .72);
      animation: floatUp linear forwards;
      filter: drop-shadow(0 4px 7px rgba(120,50,75,.14));
    }

    .spark {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(198,154,85,.75);
      animation: twinkle ease-in-out infinite alternate;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(.7);
        opacity: 0;
      }
      10% { opacity: 1; }
      100% {
        transform: translateY(-115vh) rotate(340deg) scale(1.25);
        opacity: 0;
      }
    }

    @keyframes twinkle {
      from {
        transform: scale(.45);
        opacity: .15;
      }
      to {
        transform: scale(1.35);
        opacity: .9;
      }
    }

    @media (max-width: 520px) {
      .scene {
        min-height: 590px;
      }

      .open-button {
        bottom: 16px;
        width: calc(100% - 48px);
        max-width: 320px;
      }

      .letter {
        padding: 28px 22px 22px;
      }

      .opened .letter {
        height: 390px;
        transform: translateY(-140px);
      }

      .envelope-wrapper {
        transform: translateY(-30px) scale(.88);
      }

      .opened .envelope-wrapper {
        transform: translateY(18px) scale(.88);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="sparkles" aria-hidden="true"></div>
  <div class="hearts" aria-hidden="true"></div>

  <main class="scene" id="scene">
    <h1 class="title">
      A little something for you
      <span class="subtitle">My future wife</span>
    </h1>

    <div class="envelope-wrapper">
      <div class="envelope">
        <div class="back"></div>

        <article class="letter">
          <h2>Scratch to Reveal</h2>

          <div class="scratch-card" id="scratchCard">
            <div class="date-reveal">
              <span class="date-label">Our Wedding Day</span>
              <strong>January 27, 2027</strong>
              <span class="date-place">Philippines</span>
            </div>
            <canvas id="scratchCanvas" aria-label="Scratch card revealing the wedding date"></canvas>
          </div>

          <p class="scratch-hint">Use your finger or mouse to scratch the card ✨</p>
        </article>

        <div class="front"></div>
        <div class="pocket"></div>
        <div class="flap"></div>
        <div class="seal">♥</div>
      </div>
    </div>

    <button class="open-button" id="openButton" type="button">
      Open My Heart
    </button>
  </main>

  <script>
    const scene = document.getElementById("scene");
    const openButton = document.getElementById("openButton");
    const heartsLayer = document.querySelector(".hearts");
    const sparklesLayer = document.querySelector(".sparkles");

    let opened = false;

    openButton.addEventListener("click", () => {
      if (opened) return;
      opened = true;

      scene.classList.add("opened");
      releaseHearts(34);
      setTimeout(setupScratchCard, 1500);

      // A softer second wave makes the animation feel magical.
      setTimeout(() => releaseHearts(18), 900);
    });

    function releaseHearts(amount) {
      const symbols = ["♥", "♡", "❤", "❣"];

      for (let i = 0; i < amount; i++) {
        const heart = document.createElement("span");
        heart.className = "heart";
        heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];

        heart.style.left = `${Math.random() * 100}%`;
        heart.style.fontSize = `${14 + Math.random() * 24}px`;
        heart.style.animationDuration = `${4.5 + Math.random() * 4}s`;
        heart.style.animationDelay = `${Math.random() * 1.8}s`;

        heartsLayer.appendChild(heart);
        setTimeout(() => heart.remove(), 10000);
      }
    }

    function createSparkles() {
      const count = 36;

      for (let i = 0; i < count; i++) {
        const spark = document.createElement("span");
        spark.className = "spark";

        spark.style.left = `${Math.random() * 100}%`;
        spark.style.top = `${Math.random() * 100}%`;
        spark.style.animationDuration = `${1.4 + Math.random() * 2.5}s`;
        spark.style.animationDelay = `${Math.random() * 2}s`;

        sparklesLayer.appendChild(spark);
      }
    }


    const scratchCard = document.getElementById("scratchCard");
    const scratchCanvas = document.getElementById("scratchCanvas");
    const scratchCtx = scratchCanvas.getContext("2d", { willReadFrequently: true });

    let isScratching = false;
    let scratchReady = false;
    let checkedProgress = 0;

    function setupScratchCard() {
      const rect = scratchCard.getBoundingClientRect();
      const ratio = Math.max(window.devicePixelRatio || 1, 1);

      scratchCanvas.width = Math.round(rect.width * ratio);
      scratchCanvas.height = Math.round(rect.height * ratio);
      scratchCtx.setTransform(ratio, 0, 0, ratio, 0, 0);

      const gradient = scratchCtx.createLinearGradient(0, 0, rect.width, rect.height);
      gradient.addColorStop(0, "#b6cad8");
      gradient.addColorStop(.45, "#d5e4ee");
      gradient.addColorStop(1, "#8ca9bd");

      scratchCtx.globalCompositeOperation = "source-over";
      scratchCtx.fillStyle = gradient;
      scratchCtx.fillRect(0, 0, rect.width, rect.height);

      scratchCtx.fillStyle = "rgba(255,255,255,.22)";
      for (let i = 0; i < 120; i++) {
        scratchCtx.beginPath();
        scratchCtx.arc(
          Math.random() * rect.width,
          Math.random() * rect.height,
          Math.random() * 1.8 + .4,
          0,
          Math.PI * 2
        );
        scratchCtx.fill();
      }

      scratchCtx.fillStyle = "rgba(104,70,30,.82)";
      scratchCtx.font = "600 15px Arial";
      scratchCtx.textAlign = "center";
      scratchCtx.textBaseline = "middle";
      scratchCtx.fillText("SCRATCH HERE", rect.width / 2, rect.height / 2 - 5);

      scratchCtx.font = "22px Georgia";
      scratchCtx.fillText("✦  ✦  ✦", rect.width / 2, rect.height / 2 + 30);

      scratchReady = true;
    }

    function getScratchPoint(event) {
      const rect = scratchCanvas.getBoundingClientRect();
      const source = event.touches ? event.touches[0] : event;
      return {
        x: source.clientX - rect.left,
        y: source.clientY - rect.top
      };
    }

    function scratchAt(event) {
      if (!isScratching || !scratchReady) return;
      event.preventDefault();

      const point = getScratchPoint(event);
      scratchCtx.globalCompositeOperation = "destination-out";
      scratchCtx.beginPath();
      scratchCtx.arc(point.x, point.y, 25, 0, Math.PI * 2);
      scratchCtx.fill();

      checkedProgress++;
      if (checkedProgress % 12 === 0) checkScratchProgress();
    }

    function checkScratchProgress() {
      const pixels = scratchCtx.getImageData(
        0,
        0,
        scratchCanvas.width,
        scratchCanvas.height
      ).data;

      let transparent = 0;
      for (let i = 3; i < pixels.length; i += 40) {
        if (pixels[i] < 60) transparent++;
      }

      const sampledPixels = pixels.length / 40;
      if (transparent / sampledPixels > 0.42) {
        scratchCard.classList.add("completed");
        releaseHearts(24);
      }
    }

    function beginScratch(event) {
      isScratching = true;
      scratchAt(event);
    }

    function endScratch() {
      isScratching = false;
      checkScratchProgress();
    }

    scratchCanvas.addEventListener("mousedown", beginScratch);
    scratchCanvas.addEventListener("mousemove", scratchAt);
    window.addEventListener("mouseup", endScratch);

    scratchCanvas.addEventListener("touchstart", beginScratch, { passive: false });
    scratchCanvas.addEventListener("touchmove", scratchAt, { passive: false });
    window.addEventListener("touchend", endScratch);

    window.addEventListener("resize", () => {
      if (!scratchCard.classList.contains("completed")) {
        setupScratchCard();
      }
    });

    setTimeout(setupScratchCard, 100);

    createSparkles();
  </script>
</body>
</html>
